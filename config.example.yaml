# OracleSchemaRefresh — example refresh configuration
# Copy to refresh.yaml and adjust tables/schemas as needed.

source_schema: BACKOFFICE
target_schema: LDEBURNA

# Tables to refresh. FK parents are auto-discovered and included
# unless auto_include_fk_parents is false.
tables:
  - SUN_LEDGER

# If true, walk the FK graph and pull in any parent tables that
# SUN_LEDGER depends on (same source schema only).
auto_include_fk_parents: true

# If true: DROP TABLE CASCADE CONSTRAINTS PURGE then re-CREATE.
# If false (default): TRUNCATE + INSERT (preserves table structure).
recreate_tables: false

# per_table (default): COMMIT after each table's INSERT iff source and
#   target row counts match; ROLLBACK that table on mismatch.
# defer_insert_commits: hold all INSERTs in one transaction, COMMIT at
#   the end iff every table matched, otherwise ROLLBACK the batch.
# all_or_nothing: deprecated alias for defer_insert_commits. TRUNCATE
#   auto-commits as DDL regardless of this setting.
commit_mode: per_table

# Change to "" to use conventional INSERT (slower but allows
# concurrent reads during load).
insert_hint: "/*+ APPEND */"

# Per-call timeout in seconds. 0 (default) disables it. Set to a
# sensible upper bound (e.g. 3600 for a 1-hour ceiling per Oracle
# call) so a runaway INSERT can't hang the CLI indefinitely.
call_timeout_seconds: 0

# Cross-host source link. Leave commented out for same-instance
# refresh — the schema-refresh CLI does not support cross-host (use
# oracdb for that). Accepted forms:
#   existing:LINK_NAME  — reuse a DBA-provisioned DB link.
#   session             — create a private link at job start, drop on
#                          exit. Requires CREATE DATABASE LINK priv.
# dblink: existing:PROD_US02_LINK
